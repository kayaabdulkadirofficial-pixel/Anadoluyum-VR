<script>
  const routeTours = {
  "nemrut": 27,
  "il-4": 28,
  "il-17": 39,
  "il-23": 52,
  "pamukkale": 53,
  "il-32": 61,
  "efes": 70,
  "catalhoyuk": 72,
  "il-54": 73,
  "goreme": 77,
  "gobeklitepe": 80,
  "il-76": 83
};
  const query = new URLSearchParams(location.search);
  const route = query.get("rota");
  const select = document.getElementById("scene");
  const viewer = document.getElementById("viewer");
  const external = document.getElementById("external");
  const status = document.getElementById("status");
  function showScene() {
    const choice = select.selectedOptions[0];
    viewer.hidden = external.hidden = !choice.value;
    if (!choice.value) {
      viewer.removeAttribute("src");
      external.removeAttribute("href");
      status.textContent = route ? "Bu rota için eşleştirilmiş sanal tur yok. Listeden başka bir yer seçebilirsin." : "Gezmek istediğin yeri seç.";
      return;
    }
    viewer.title = choice.textContent + " sanal turu";
    viewer.src = external.href = choice.value;
    status.textContent = choice.textContent + " · Tur açılmazsa ayrı sekmede görüntüleyebilirsin.";
  }
  select.addEventListener("change", showScene);
  const initial = route ? routeTours[route] : 70;
  const option = Array.from(select.options).find(o => o.dataset.tour === String(initial));
  if (option) select.value = option.value;
  showScene();
  const figures = Array.from(document.querySelectorAll("figure"));
  const all = document.getElementById("show-all");
  const note = document.getElementById("gallery-note");
  if (route) {
    const related = figures.filter(f => f.dataset.route === route);
    if (related.length) {
      figures.forEach(f => { f.hidden = f.dataset.route !== route; });
      all.hidden = false;
      all.onclick = () => { figures.forEach(f => { f.hidden = false; }); all.hidden = true; };
    } else {
      note.hidden = false;
      note.textContent = "Bu rota için ek fotoğraf yok. Aşağıda diğer yerlerin fotoğrafları var.";
    }
  }
</script>
